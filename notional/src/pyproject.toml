[project]
name = "src"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
requires-python = ">=3.11"
dependencies = [
    "pandas (>=2.3.1,<3.0.0)",
    "click (>=8.2.1,<9.0.0)",
    "pytest (>=8.0.0,<9.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "sqlalchemy (>=2.0.43,<3.0.0)",
    "pyodbc (>=5.2.0,<6.0.0)"
]

[tool.poetry]
packages = [
    { include = "app.py" },
    { include = "iointerface.py" }
]
